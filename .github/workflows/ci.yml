name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Publicar el APK de producción como Release de GitHub (descarga directa desde el móvil).
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests y lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secretos del repositorio (Settings → Secrets and variables → Actions). Si no existen,
      # todo funciona igual: la app sin AEMET y los APK firmados con una clave temporal.
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      CARP_KEYSTORE_BASE64: ${{ secrets.CARP_KEYSTORE_BASE64 }}
      CARP_KEYSTORE_PASSWORD: ${{ secrets.CARP_KEYSTORE_PASSWORD }}
      CARP_KEY_ALIAS: ${{ secrets.CARP_KEY_ALIAS }}
      CARP_KEY_PASSWORD: ${{ secrets.CARP_KEY_PASSWORD }}
      # Cada ejecución sube el número de versión para que el APK nuevo actualice al anterior.
      CARP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # La clave nunca está en el repositorio: se reconstruye desde el secreto en un directorio temporal.
      - name: Preparar la clave de firma
        if: env.CARP_KEYSTORE_BASE64 != ''
        run: |
          echo "$CARP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/carpstrategy.jks"
          echo "CARP_KEYSTORE_FILE=$RUNNER_TEMP/carpstrategy.jks" >> "$GITHUB_ENV"

      # La huella SHA-1 no es secreta (va en cada APK): hace falta para la credencial de Android
      # en Google Cloud (inicio de sesión con Google, docs/CUENTA_GOOGLE.md).
      - name: Huella SHA-1 de la clave de firma
        if: env.CARP_KEYSTORE_BASE64 != ''
        run: |
          keytool -list -v -keystore "$CARP_KEYSTORE_FILE" -storepass "$CARP_KEYSTORE_PASSWORD" -alias "$CARP_KEY_ALIAS" \
            | grep -E "SHA1:|SHA-1:" | sed 's/^[[:space:]]*/Huella /'

      - name: Aviso si falta la clave
        if: env.CARP_KEYSTORE_BASE64 == ''
        run: echo "::notice::Sin secreto CARP_KEYSTORE_BASE64. El APK de prueba se firma con una clave temporal y no podrá actualizarse sin desinstalar (ver docs/INSTALACION.md)."

      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Los esquemas de Room se generan al compilar y deben estar versionados en app/schemas.
      - name: Comprobar esquemas de Room versionados
        run: |
          git status --porcelain app/schemas
          for f in $(git ls-files --others --modified app/schemas); do
            echo "::warning file=$f::Esquema de Room nuevo o cambiado sin versionar"
            echo "----- $f -----"; cat "$f"; echo
          done

      - name: APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: CarpStrategy-prueba-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Versión de producción: solo en main y solo con la clave fija.
      - name: Build release
        if: github.ref == 'refs/heads/main' && env.CARP_KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --stacktrace

      - name: APK de producción
        if: github.ref == 'refs/heads/main' && env.CARP_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CarpStrategy-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Release con el APK como CarpStrategy.apk: la app avisa de las versiones nuevas leyendo la
      # última Release (etiqueta v<versionName>-<número de ejecución>).
      - name: Publicar Release
        if: github.ref == 'refs/heads/main' && env.CARP_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          TAG="v${VERSION_NAME}-${CARP_VERSION_CODE}"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/CarpStrategy.apk"
          printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 > "$RUNNER_TEMP/notas.txt"
          gh release create "$TAG" "$RUNNER_TEMP/CarpStrategy.apk" \
            --title "CarpStrategy ${VERSION_NAME} (${CARP_VERSION_CODE})" \
            --notes-file "$RUNNER_TEMP/notas.txt" --latest

      - name: Borrar la clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/carpstrategy.jks"

      - name: Informes de tests y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
